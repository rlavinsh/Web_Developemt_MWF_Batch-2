<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colleage form</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Personal Information</legend>
        <label for="fname">FullName</label>
        <input
          type="text"
          placeholder="Enter your name"
          id="fname"
          name="fname"
        />
        <br /><br />
        <label for="">Email:</label>
        <input type="email" />
        <br /><br />
        <label for="">Date of Birth:</label>
        <input type="date" min="1995-01-01" max="2000-12-31" name="dob" />
        <br /><br />
        <label for="">Profile Picture</label>
        <input type="file" accept=".png" />
      </fieldset>
    </form>
    <!-- Homework -->
    https://rlavinsh.github.io/Form-Task-1/
  </body>
</html>
