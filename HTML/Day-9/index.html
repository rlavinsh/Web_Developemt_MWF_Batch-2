<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Forms</title>
  </head>
  <body>
    <h1>Login Form</h1>
    <form>
      <label for="fName">FirstName</label>
      <br />
      <input type="text" placeholder="Enter your FirstName" id="fName" />
      <br />
      <label for="lName">LastName</label>
      <br />
      <input type="text" placeholder="Enter your LastName" id="lName" />
      <br />
      <br />
      <button>Submit</button>
    </form>
  </body>
</html>
